name: fake-eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fake-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      MARLOW_LLM: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Fake deps (no model extra, no API key)
        run: uv sync --frozen
      - name: Frozen Fake eval
        run: uv run pytest

  keyline:
    runs-on: ubuntu-latest
    env:
      MARLOW_LLM: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Fake deps (no model extra, no API key)
        run: uv sync --frozen
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Keyline eval
        run: uv run pytest evals/keyline
