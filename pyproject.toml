[project]
name = "marlow"
version = "0.1.0"
description = "IT ticket agent PoC — personal project with simulated data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1",
    "sqlalchemy>=2.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.62.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
