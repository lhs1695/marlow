{% extends "base.html" %}
{% block title %}工单 — Marlow{% endblock %}
{% block body %}
<h1 class="page-title">工单</h1>
<div class="card card-flush">
  <table class="ticket-table" data-testid="ticket-list">
    <thead>
      <tr>
        <th>单号</th>
        <th>标题</th>
        <th>状态</th>
        <th>优先级</th>
        <th>队列</th>
      </tr>
    </thead>
    <tbody>
      {% for t in tickets %}
      <tr data-testid="ticket-row-{{ t.id }}" class="click-row">
        <td class="mono id-cell"><a class="stretch-link" href="/tickets/{{ t.id }}">{{ t.id }}</a></td>
        <td>{{ t.title }}</td>
        <td>
          <span class="badge tone-{{ status_tone(t.status) }}">{{ status_zh(t.status) }}</span>
        </td>
        <td class="muted">{{ t.priority or "—" }}</td>
        <td class="muted">{{ queue_zh(t.queue) }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="5" class="empty">队列为空</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
