{% extends "base.html" %}
{% block title %}审批 — Marlow{% endblock %}
{% block body %}
<h1 class="page-title">审批</h1>
<div class="card card-flush">
  <table class="ticket-table" data-testid="approval-queue">
    <thead>
      <tr>
        <th>单号</th>
        <th>标题</th>
        <th>状态</th>
        <th>请求人</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for t in tickets %}
      <tr data-testid="approval-item" data-ticket-id="{{ t.id }}">
        <td class="mono id-cell"><a href="/tickets/{{ t.id }}">{{ t.id }}</a></td>
        <td>{{ t.title }}</td>
        <td>
          <span class="badge tone-{{ status_tone(t.status) }}">{{ status_zh(t.status) }}</span>
        </td>
        <td class="mono muted">{{ t.requester_id }}</td>
        <td class="actions">
          <form method="post" action="/approvals" class="row">
            <input type="hidden" name="ticket_id" value="{{ t.id }}">
            <input type="hidden" name="target_employee_id" value="{{ t.requester_id }}">
            <button type="submit" class="ghost" name="decision" value="approve" data-testid="approval-approve">批准</button>
            <button type="submit" name="decision" value="reject" class="danger" data-testid="approval-reject">拒绝</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr>
        <td colspan="5" class="empty">没有待批变更</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
