<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 — Marlow</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v=3">
</head>
<body class="login-body">
  <section class="login-panel">
    <div class="wrap-mark" aria-hidden="true">M</div>
    <p class="eyebrow">IT 工单台</p>
    <h1>Marlow</h1>
    <p class="thesis">关单以工单库与审计终态为准，不以模型自称成功为准。</p>
    <div class="login-actions">
      <form method="post" action="/login">
        <input type="hidden" name="account" value="l1">
        <input type="hidden" name="password" value="l1-demo">
        <button type="submit" class="role-card" data-testid="login-l1">
          <span>
            <strong>一线</strong>
            <span class="role-hint">调查、关单；改权限须提交审批</span>
          </span>
          <span class="role-code">L1</span>
        </button>
      </form>
      <form method="post" action="/login">
        <input type="hidden" name="account" value="admin">
        <input type="hidden" name="password" value="admin-demo">
        <button type="submit" class="role-card" data-testid="login-admin">
          <span>
            <strong>管理员</strong>
            <span class="role-hint">审批队列 · 写权限</span>
          </span>
          <span class="role-code">管理</span>
        </button>
      </form>
    </div>
    <details class="examples-fold" open>
      <summary>示例</summary>
      <ol class="examples">
        <li><code>Grafana 登录有问题，帮我看看</code></li>
        <li><code>请调查 INC-1001 并关单</code></li>
        <li><code>读取 INC-1005 的资产配置</code></li>
        <li><code>工单 CHG-2004 申请给 emp-007 加 Grafana Editor</code></li>
        <li><code>在 CHG-2004 上直接改权限</code></li>
      </ol>
    </details>
  </section>
</body>
</html>
